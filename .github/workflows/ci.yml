name: CI

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request: {}
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  heasarc-channel: "https://heasarc.gsfc.nasa.gov/FTP/software/conda/"

jobs:
  build:
    name: Build Source Distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install Python Dependencies
        run: |
          pip install -U pip
          pip install -U build twine

      - name: Build and Check Source Distribution
        run: |
          python -m build --sdist .
          python -m twine check --strict dist/*

      - name: Upload Source Distribution as Artifact
        uses: actions/upload-artifact@v7
        with:
          name: elisa
          path: dist/*

  tests:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    needs: build
    defaults:
      run:
        shell: bash -el {0}
    env:
      extra: "${{ matrix.extra }}"
      CURATED_TEST_DATA: "${{ github.workspace }}/external/curated-test-data"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Tests (Python 3.14 on Linux-x64)
            os: "ubuntu-latest"
            python-version: "3.14"
            uv-resolution: "highest"
            jax-version: "0.9.2"
            blackjax-version: "1.6.2"
            astropy-version: ""
            extra: "xspec"
            upload-coverage: true

          - name: Tests (Python 3.14 on macOS-arm64)
            os: "macos-latest"
            python-version: "3.14"
            uv-resolution: "highest"
            jax-version: "0.9.2"
            blackjax-version: "1.6.2"
            astropy-version: ""
            extra: "xspec"
            upload-coverage: false

          - name: Tests (Lowest Version Deps)
            os: "ubuntu-latest"
            python-version: "3.11"
            uv-resolution: "lowest-direct"
            jax-version: "0.6.0"
            blackjax-version: "1.3"
            astropy-version: "5.3"
            extra: ""
            upload-coverage: false
    steps: &test_steps
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout curated test data
        uses: actions/checkout@v7
        with:
          repository: HEACIT/curated-test-data
          path: external/curated-test-data
          fetch-depth: 1
          sparse-checkout: |
            observations.yml
            Chandra
            HXMT
            Hitomi
            IXPE
            Lynx
            NICER
            NuSTAR
            XMM-Newton
            XRISM

      - name: Setup Miniforge
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          python-version: ${{ matrix.python-version }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Install XSPEC
        if: ${{ matrix.extra == 'xspec' }}
        run: |
          mamba install xspec -c ${{ env.heasarc-channel }} -c conda-forge -y

      - name: Download Source Distribution
        uses: actions/download-artifact@v8
        with:
          name: elisa

      - name: Install Python Dependencies
        run: |
          printf 'jax==%s\njaxlib==%s\n' \
            "${{ matrix.jax-version }}" \
            "${{ matrix.jax-version }}" \
            > jax-constraints.txt
          uv pip compile pyproject.toml \
            $(echo "${extra}" | tr ',' '\n' | xargs -I {} echo --extra {}) \
            --constraints jax-constraints.txt \
            --output-file requirements.txt \
            --resolution ${{ matrix.uv-resolution }}
          extras="test"
          if [[ -n "${extra}" ]]; then
            extras="${extra},${extras}"
          fi
          # Keep PEP 517 build isolation aligned with the resolved runtime deps.
          uv pip install "$(ls astro_elisa-*.tar.gz)[${extras}]" \
            --overrides requirements.txt \
            --build-constraint requirements.txt \
            --verbose

      - name: Verify JAX Version
        env:
          EXPECTED_JAX_VERSION: "${{ matrix.jax-version }}"
          EXPECTED_BLACKJAX_VERSION: "${{ matrix.blackjax-version }}"
          EXPECTED_ASTROPY_VERSION: "${{ matrix.astropy-version }}"
        run: |
          python - <<'PY'
          import importlib.metadata
          import os

          import jax
          import jaxlib

          blackjax_version = importlib.metadata.version('blackjax')
          expected_jax = os.environ['EXPECTED_JAX_VERSION']
          expected_blackjax = os.environ['EXPECTED_BLACKJAX_VERSION']
          print(
              f'JAX {jax.__version__}, JAXLIB {jaxlib.__version__}, '
              f'BlackJAX {blackjax_version}'
          )
          assert jax.__version__ == expected_jax
          assert jaxlib.__version__ == expected_jax
          assert blackjax_version == expected_blackjax
          if expected_astropy := os.environ.get('EXPECTED_ASTROPY_VERSION'):
              assert importlib.metadata.version('astropy') == expected_astropy
          PY

      - name: Run Tests
        run: |
          if [[ "${{ matrix.upload-coverage }}" == "true" ]]; then
            pytest
          else
            pytest --no-cov
          fi

      - name: Upload Test Results
        if: ${{ !cancelled() && matrix.upload-coverage }}
        uses: codecov/test-results-action@v1
        with:
          file: junit.xml
          flags: "py${{ matrix.python-version }}"
          name: "Python ${{ matrix.python-version }}"
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          verbose: true

      - name: Upload Coverage Results
        if: ${{ matrix.upload-coverage }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          verbose: true

  compatibility:
    name: ${{ matrix.name }}
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    needs: build
    defaults:
      run:
        shell: bash -el {0}
    env:
      extra: "${{ matrix.extra }}"
      CURATED_TEST_DATA: "${{ github.workspace }}/external/curated-test-data"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Tests (Python 3.11, JAX 0.9)
            os: "ubuntu-latest"
            python-version: "3.11"
            uv-resolution: "highest"
            jax-version: "0.9.2"
            blackjax-version: "1.6.2"
            astropy-version: ""
            extra: "xspec"
            upload-coverage: false

          - name: Tests (Python 3.11, JAX 0.8)
            os: "ubuntu-latest"
            python-version: "3.11"
            uv-resolution: "highest"
            jax-version: "0.8.2"
            blackjax-version: "1.3"
            astropy-version: ""
            extra: ""
            upload-coverage: false

          - name: Tests (Python 3.11, JAX 0.7)
            os: "ubuntu-latest"
            python-version: "3.11"
            uv-resolution: "highest"
            jax-version: "0.7.2"
            blackjax-version: "1.3"
            astropy-version: ""
            extra: ""
            upload-coverage: false

          - name: Tests (Python 3.11, JAX 0.6.2)
            os: "ubuntu-latest"
            python-version: "3.11"
            uv-resolution: "highest"
            jax-version: "0.6.2"
            blackjax-version: "1.3"
            astropy-version: ""
            extra: ""
            upload-coverage: false
    steps: *test_steps

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [ build, tests, compatibility ]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    environment:
      name: PyPI
      url: https://pypi.org/p/astro-elisa
    permissions:
      id-token: write
    steps:
      - name: Download Source Distribution
        uses: actions/download-artifact@v8
        with:
          name: elisa
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2
